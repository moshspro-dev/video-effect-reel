name: Effect suggestion
description: Suggest an editing technique that is missing from the library
labels: [effect]
body:
  - type: input
    id: name
    attributes:
      label: Effect name (the name editors know it by)
      placeholder: "Speed ramp"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What does it look like on screen?
      description: A short description of the effect and when it works well.
    validations:
      required: true
  - type: textarea
    id: recipe
    attributes:
      label: How can it be recreated on your own footage?
      description: Steps, timing, and an FFmpeg command or the name of the effect in Remotion or your editing tool, if you know one.
  - type: input
    id: reference
    attributes:
      label: Link to documentation or an explanation (optional)
      description: Official docs or a good tutorial are best. Please don't upload other people's videos.
