name: דיווח על באג / Bug report
description: משהו לא עובד ב-CLI או בדף האינטרנט
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: מה קרה ומה ציפית שיקרה?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: איך משחזרים?
      description: הפקודה שהרצת או מה לחצת בדף.
  - type: textarea
    id: logs
    attributes:
      label: הודעת שגיאה
      description: הסירו נתיבים, כתובות IP או קישורים פרטיים לפני ההדבקה.
      render: text
