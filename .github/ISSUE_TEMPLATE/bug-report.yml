name: Bug report
description: Something doesn't work in the CLI or the web page
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can it be reproduced?
      description: The command you ran, or what you clicked on the page.
  - type: textarea
    id: logs
    attributes:
      label: Error output
      description: Remove file paths, IP addresses and private links before pasting.
      render: text
